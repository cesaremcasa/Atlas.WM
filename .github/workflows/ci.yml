name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Install the canonical, fully-pinned uv.lock toolchain in every job. The
# hashed requirements.lock export is audited by the security job below.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked toolchain
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check src/ tests/ scripts/
      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  type:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked toolchain + package
        run: uv sync --locked --extra dev
      - name: mypy
        run: uv run mypy src/atlas_wm

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked toolchain + package
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q --cov=atlas_wm --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked toolchain
        run: uv sync --locked --extra dev
      - name: bandit
        run: uv run bandit -r src/ -ll
      - name: pip-audit
        run: uv run pip-audit -r requirements.lock --progress-spinner off
      - name: Forbid pickle in production code
        run: |
          ! grep -rE "torch\.load|pickle\.load|torch\.save" src/atlas_wm/ \
            $(find scripts/ -name "*.py" ! -name "migrate_pt_to_safetensors.py")
      - name: Forbid legacy encoder imports in production
        run: |
          ! grep -rE "from .*structured_encoder|import.*structured_encoder" src/atlas_wm/ scripts/ tests/
      - name: Verify SBOM is valid JSON
        run: python -c "import json; json.load(open('sbom.json'))" && echo "SBOM OK"
      - name: Verify SBOM is lock-derived and reproducible
        run: |
          uv run python scripts/generate_sbom.py \
            --project pyproject.toml --lock requirements.lock --output /tmp/sbom.json
          cmp --silent sbom.json /tmp/sbom.json
