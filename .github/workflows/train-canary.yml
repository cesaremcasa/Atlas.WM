name: Train Canary (Determinism)

on:
  schedule:
    - cron: "0 8 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Determinism canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked toolchain
        run: uv sync --locked --extra dev
      - name: Run determinism + training canaries
        run: uv run pytest tests/test_determinism_canary.py tests/test_training_canary.py -v
      - name: Verify checkout clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
